<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Pengaturan alamat IP">
  <rect width="800" height="450" fill="#fbf1e6"/>
  <g font-family="Consolas, monospace" font-size="22" fill="#4a2c0a">
    <rect x="120" y="90" width="560" height="270" rx="10" fill="#ffffff" stroke="#b36a1d" stroke-width="3"/>
    <text x="160" y="150">IP address  : 192.168.1.10</text>
    <text x="160" y="200">Subnet mask : 255.255.255.0</text>
    <text x="160" y="250">Gateway     : 192.168.1.1</text>
    <text x="160" y="300">DNS         : 8.8.8.8</text>
  </g>
</svg>
